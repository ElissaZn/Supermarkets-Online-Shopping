      <script type="text/javascript">
         document.addEventListener('DOMContentLoaded', () => {
             const products = document.querySelectorAll('.product');
 
             function loadRemovedItems() {
                 let removedItems = JSON.parse(localStorage.getItem('removedItems')) || [];
                 products.forEach(product => {
                     const productName = product.querySelector('.shopItemTitle').textContent;
                     if (removedItems.includes(productName)) {
                         product.remove();
                     }
                 });
             }
 
             loadRemovedItems();
         });
     </script>
     
     <script>
      // JavaScript to handle the "PURCHASE" button click
      document.getElementById('purchaseButton').addEventListener('click', function() {
          window.location.href = '/Ordering/OrderingCO.html'; // Navigate to the desired URL
      });
  </script>
<script type="text/javascript">
   function loadProducts() {
  let products = JSON.parse(localStorage.getItem('products')) || [];
  const productContainer = document.querySelector('.producttss');

  products.forEach(product => {
      const productHTML = `
          <div class="product">
              <img class="shopItemImage" src="${product.imageDataUrl}" style="width:250px; height:250px;">
              <h3 class="shopItemTitle">${product.title}</h3>
              <div class="price shopItemPrice">$${product.price}</div>
              <div class="buttons">
               <a href="#" class="buy btn btnBuy btnBuyNow">buy now</a>
              </div>
          </div>
      `;
      productContainer.insertAdjacentHTML('beforeend', productHTML);
  });
}

loadProducts();
</script>
