<script>
    var sum=0;
    var data = JSON.parse(localStorage.getItem("Cart")) || [];
    console.log(data)
    data.map(function (el, index) {
        var tr = document.createElement("tr");

        var td1 = document.createElement("td");
        td1.innerHTML = `<i class="bi bi-trash3"></i>`;
        td1.style.padding="25px"
        td1.style.fontSize="20px";
        td1.addEventListener("click", function () {
            removeItems(el, index)
        });


        var td2 = document.createElement("td");
        var img = document.createElement("img");
        img.src = el.image_url;
        img.style.width = "5vw";
        td2.append(img);

        var td3 = document.createElement("td");
        td3.innerHTML = el.detail;
        td3.style.padding="25px";

        var td4 = document.createElement("td");
        td4.innerText = "$"+Math.ceil(el.price);
        td4.style.padding="25px";

        var btn1= document.createElement("button");
        btn1.style.border="none"
        btn1.innerText="+"
        btn1.addEventListener("click", function () {
            // removeItems(el, index)
            el.quant++;
            localStorage.setItem("Cart",JSON.stringify((data)))
            window.location.reload()
        });
        var inp=document.createElement("input");
        inp.style.border="none"
        inp.style.textAlign="center"
        inp.style.width="25px"
        inp.value=el.quant
        var btn2= document.createElement("button");
        btn2.style.border="none"
        btn2.innerText=" - "
        btn2.addEventListener("click", function () {
            // removeItems(el, index)
            if(el.quant>1){

                el.quant--;
                localStorage.setItem("Cart",JSON.stringify((data)))
                window.location.reload()
            }
        });

        var div=document.createElement("div");
        div.style.padding="25px"
        div.append(btn1,inp,btn2)

        
        var td6 = document.createElement("td");
        td6.innerText = "$"+ Math.ceil(el.price*el.quant);
        td6.style.padding="25px";
        td6.style.color="red";
        td6.style.fontWeight="bold";
        td6.style.fontSize="20px";
        tr.append(td1, td2, td3, td4, div, td6)
        
        document.querySelector("#carttbody").append(tr)
        // console.log(el)
        sum=sum+ Math.ceil(el.price*el.quant);

    });
    // updatecart();
    var count=0
    function apply_coupon(){
        var code = document.querySelector("#CouponCode").value
        console.log(code)
        if(code=="OFF10" && count<1){
            sum=Math.ceil(sum-(sum*10)/100);
            // Math.ceil(sum)
            count++;
            var notofi = document.querySelector("#notifiction")
            notofi.innerHTML=`
            <div class="alert alert-success alert-dismissible fade show" role="alert">
            <strong>Accepted !</strong> Your Coupan code is validate and you have Discount 10%.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>`
        }else if(code!=="OFF10"){
            var notofi = document.querySelector("#notifiction")
            notofi.innerHTML=`
            <div class="alert alert-warning alert-dismissible fade show" role="alert">
            <strong>Oops! Your Coupan is not validate</strong> Tey Next Time! 
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>`
        }else{
            var notofi = document.querySelector("#notifiction")
            notofi.innerHTML=`
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Sorry..!</strong> You are all ready coupan code is use.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>`
        }

    }




    function removeItems(el, index) {
        //   console.log(el,index)
        data.splice(index, 1);
        console.log(data)
        localStorage.setItem("Cart", JSON.stringify(data));
        window.location.reload();
    }

    function updatecart()
    {
        document.querySelector("#subtotals").innerText =  "$ "+sum;
        
        var gst = (sum * 18) /100;
        document.querySelector("#gst").innerHTML =  "$ "+Math.ceil(gst);
    
        var tot = sum + gst;
       var subtotal =  document.querySelector("#totalss").innerText = "$ "+Math.round(tot); 
       subtotal.style.color = "red";
    }


</script>
